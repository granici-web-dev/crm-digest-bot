[project]
name = "crm-digest-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pandas>=3.0.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "xlsxwriter>=3.2",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "openpyxl>=3.1.5",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "syrupy>=4.7",
    "testcontainers[postgres]>=4.7",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
# Комментарии и тексты по-русски (PRINCIPLES.md): кириллица не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "apscheduler.*", "xlsxwriter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["digest", "factories", "fakes", "conftest"]
