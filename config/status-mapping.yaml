# Маппинг status.name из mefi → категория. Читается кодом при старте.
# Неизвестный статус → UNMAPPED (считается отдельно, алерт в служебный бот).
# Сравнение по точному совпадению после trim; регистр и диакритику не нормализовать.
# lifecycle из mefi для категории не используется: все лиды со статусом там "active"
# (проверено 24.09.2026, docs/mefi-api-notes.md).
# status = null → UNMAPPED: штатное состояние формы mefi, статус "Necompletat"; в UNMAPPED,
# алерт формулировать как "лид без статуса".

categories:
  WON:
    statuses: ["Clienți"]
    also_when: converted_at_not_null       # дублирующий признак; расхождение → алерт
  ACTIVE:
    # "BIFE 2026": лиды с выставки BIFE-SIM 2026; метка через статус, при смене статуса теряется.
    statuses: ["IN PROCES", "Ofertat", "SHOWROOM", "BIFE 2026"]
    # Срок алерта «без движения» один на проект: kpi.yaml active_offer_stale_days.
  ACTIVE_FOLLOWUP:
    statuses: ["Revenire 1", "Revenire 2", "Revenire 3"]
    counts_as: ACTIVE
  LOST:
    reasons:
      # В mefi Stand BY — lifecycle active; LOST — наша категория по брифу §3.
      # label: подпись причины в отчётах (w4), по docs/report-menu.md.
      STAND_BY:          { statuses: ["Stand BY"], followup_field: "Data revenire", label: "Stand BY" }
      NU_RASPUNS:        { statuses: ["NU A RASPUNS"], label: "Nu a răspuns" }
      A_REFUZAT:         { statuses: ["A REFUZAT"], label: "A refuzat" }
      PRODUS_NEPOTRIVIT: { statuses: ["PRODUS NEPOTRIVIT"], label: "Produs nepotrivit" }
      BUGET:             { statuses: ["BUGET"], label: "Buget" }
      CONCURENT:         { statuses: ["CONCURENTA"], label: "Concurență" }
      TIMP:              { statuses: ["TIMP"], note: "отказ из-за срока производства 1–2 мес.", label: "Termen producție" }
      # SPAM есть в списке статусов mefi, в API-выборке 24.09.2026 не встречался.
      IRELEVANT:         { statuses: ["IRELEVANT", "SPAM"], excluded_from_useful: true, label: "Irelevant" }
  PARTNERSHIP:
    statuses: ["DESIGNER", "INFLUENCER"]
    # Бриф §3: партнёрства не лиды, исключаются из LEADS и всех KPI (ADR-002).
    excluded_from_leads: true

custom_fields:
  # Ищем по field_id, name сверяем: расхождение → алерт в служебный бот.
  showroom: { field_id: 14, name: "Showroom" }   # București | Brașov | Cluj
  ofertat:
    field_id: 20
    name: "Ofertat"
    ofertat_yes: "✅DA"                    # точное значение из mefi, эмодзи без пробела
    ofertat_no: "❌NU"                     # иное значение → алерт, лид не считается ofertat
  data_revenire: { field_id: 5, name: "Data revenire" }   # date_picker, "YYYY-MM-DD" или null
  utm:
    - { field_id: 38, name: "UTM_Source" }
    - { field_id: 39, name: "UTM_Campanie" }
    - { field_id: 40, name: "UTM_Content" }
    - { field_id: 41, name: "UTM_Medium" }

# custom_fields лида в lead_snapshots.raw только из keep. drop это textarea, свободный текст
# продавца о клиенте, в нём бывают телефоны: не пишутся. Источник H (этап 4) читает текущий
# текст заметок из API. field_id вне keep и drop → алерт, поле не пишется.
raw_custom_fields:
  keep: [5, 14, 20, 38, 39, 40, 41]
  drop:
    - { field_id: 7,  name: "Informatii" }
    - { field_id: 8,  name: "Revenire 1 (Data+Info)" }
    - { field_id: 9,  name: "Revenirea 2 (Data+info)" }
    - { field_id: 10, name: "Revenirea 3 (Data+info)" }
    - { field_id: 51, name: "Mesaj" }       # появилось после 28.05.2026

# Контакты клиента удаляются из raw до записи в lead_snapshots (путь через точку).
# location.city остаётся: это город, не контакт.
raw_strip:
  - name
  - phone
  - email
  - identity
  - business
  - company
  - website
  - title
  - description
  - location.address_line
  - location.coordinates
  # detailed_reason это свободный текст продавца о клиенте.
  - elimination.detailed_reason

# Ключи верхнего уровня лида из /leads/search, замер 24.09.2026 (27 ключей), плюс company
# из GET /leads/{id} и elimination (как у клиентов). В raw пишутся только они: новое
# контактное поле mefi не должно попасть в базу ни на день. Незнакомый ключ → проблема
# unknown_raw_key и алерт при первом появлении.
raw_known_keys:
  - assigned_to
  - business
  - client_type
  - company
  - converted_at
  - created_at
  - created_by
  - custom_fields
  - description
  - elimination
  - email
  - estimated_value
  - gclid
  - groups
  - id
  - identity
  - is_duplicate
  - is_public
  - last_contact_at
  - lifecycle
  - location
  - name
  - phone
  - priority
  - source
  - status
  - status_changed_at
  - title
  - website

# Ключи внутри объекта; незнакомый вложенный ключ → unknown_raw_key, не пишется.
raw_known_nested_keys:
  elimination: [type, reason, detailed_reason, marked_at, marked_by]

# Клиенты mefi (clients:read): строка Contract Cantitate в d1 (docs/mefi-clients-notes.md).
clients:
  # id полей клиента отличаются от лидов: Showroom у лида 14, у клиента 15.
  showroom: { field_id: 15, name: "Showroom" }
  # Клиенты, созданные раньше, это ручной ввод старых договоров при переходе на mefi
  # (решение владельца 28.09.2026): в Contract Cantitate не считаются никогда.
  contracts_count_from: 2026-06-01
  # В raw пишутся только эти ключи: в ответе клиента банковские и паспортные данные, новое поле
  # такого рода не должно попасть в базу ни на день. Незнакомый ключ → алерт.
  raw_known_keys:
    - banking
    - billing
    - business
    - business_details
    - client_type
    - created_at
    - currency
    - custom_fields
    - elimination
    - groups
    - id
    - identity
    - last_contact_at
    - last_status_change
    - name
    - responsibles
    - shipping
    - source
    - state
    - status
    - website
  # Ключи внутри объекта или списка объектов; незнакомый вложенный ключ → алерт, не пишется.
  raw_known_nested_keys:
    elimination: [type, reason, detailed_reason, marked_at, marked_by]
    responsibles: [id, name]
  # Как у лидов: textarea не пишутся, field_id вне keep и drop → алерт
  # (docs/mefi-clients-notes.md, «Кастомные поля»).
  raw_custom_fields:
    keep: [12, 15, 33, 43, 47, 48, 49, 50]
    drop:
      - { field_id: 13, name: "Informatii" }
      - { field_id: 44, name: "Revenire 1 (Data+Info)" }
      - { field_id: 45, name: "Revenirea 2 (Data+info)" }
      - { field_id: 46, name: "Revenirea 3 (Data+info)" }
  # detailed_reason это свободный текст продавца о клиенте.
  raw_strip:
    - name
    - business
    - business_details
    - identity
    - banking
    - billing
    - shipping
    - website
    - elimination.detailed_reason

sources:
  # d1: новый лид с этим источником это визит, если контакт не встречался у лида старше окна,
  # иначе revenire в Alte (ADR-006). Визит в mefi фиксируется источником, не статусом.
  showroom_visit: ["Showroom"]
  # "FacebookMessanger" — написание mefi, не исправлять.
  web: ["Site", "Mail", "Meta ADS", "FacebookMessanger"]   # строка «Leads Mail/FB/IG» в формате продавцов
  site: ["Site"]                           # из web: правило d5 «0 лидов с сайта»
  phone: ["Telefon"]
  whatsapp: ["WhatsApp"]
  # "Arhirtect" — опечатка в самой mefi (id 7), не исправлять. Архитектор это партнёр (ADR-006).
  partner: ["Colaborare", "Arhirtect"]
  # Google (id 1) и Teren (id 4): лидов нет, имена из enums.md не проверены.
  # "BIFE 2026" встречается и как источник, и как статус (выставка BIFE-SIM 2026).
  other: ["Recomandare", "Google", "Teren", "BIFE 2026"]
  # m11: клиент с этим источником повторный без совпадения контакта: первая покупка таких
  # клиентов была до mefi, по телефону их не найти (снапшот 28.09.2026). В d1 строка Alte.
  repeat_client: ["Client Fidel"]

# Порядок блоков в отчётах, как в ручном отчёте продавцов.
showrooms: ["Brașov", "București", "Cluj"]
# Название тенанта в шапке отчётов и в блоках d1 («Sofabelle Brașov»).
tenant_display_name: "Sofabelle"
# Подпись лидов без источника в отчётах (w1, w12, m7, w6) и ответах чата.
without_source_label: "Fără sursă"
# Подпись кампании UTM, похожей на телефон или e-mail: значение приходит из формы сайта как есть,
# контакт клиента в группу не выводится (инвариант 7).
hidden_campaign_label: "campanie ascunsă"

# Продавцы работают в mefi с этой даты: лиды раньше не проверяются на незаполненные поля (d3).
# Не clients.contracts_count_from: значение то же, смысл другой (ручной ввод старых договоров).
leads_created_from: 2026-06-01

# Ссылки на карточку лида в веб-интерфейсе mefi: хост из MEFI_BASE_URL, путь отсюда.
# limit: сколько ссылок в блоке отчёта или в ответе чата, остальное «și încă N» (инвариант 7).
lead_links:
  path: "/admin/leads/index/{lead_id}"
  limit: 10

# success значит «снапшот полный»: отчёты читают только success. Выше порога прогон failed,
# отчёт уходит с пометкой «данные mefi недоступны»; ниже порога расхождение идёт в алерт.
snapshot:
  completeness:
    max_missing_leads: 5          # получено меньше api_total больше чем на max(5, 0.5 %)
    max_missing_share: 0.005
    max_skipped_leads: 10         # битых лидов больше чем max(10, 1 %) от api_total
    max_skipped_share: 0.01

time:
  timezone: "Europe/Bucharest"
  daily_window_end: "19:00"
  missed_snapshot_check: "09:00"   # утром ops узнаёт о вчерашнем снапшоте, которого нет и уже не будет
  working_hours: { start: "10:00", end: "19:00" }   # правило переноса для недельного счёта
