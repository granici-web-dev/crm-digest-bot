# Пороги KPI и SPI (docs/decisions/ADR-002-kpi-brief-primary.md).
# provisional: значения из SB KPi.xlsx v2.0 (02_Setari_Targete), составлен через ИИ и с владельцем
# не согласован. Баллы, SPI, уровни и рекомендации в отчёты MVP не выводятся; первые ступени
# показываются в m5 только как цели. Калибровка после 2–3 месяцев снапшотов, отдельным ADR.
# Ключи совпадают с thresholds в tests/fixtures/etalon-2026-05.json.
# Изменение порога = ADR + обновление эталона (docs/kpi-definitions.md).

status: provisional

thresholds:
  scr_elite: 0.10
  scr_bine: 0.07
  scr_minim: 0.05
  cdr_perfect: 0.95
  cdr_minim: 0.90
  # Нет в 02_Setari_Targete: зашит в формулу 03_KPI_Agenti!W (IF(P>=0.8,10,5)).
  # Вынесен сюда, чтобы порог не жил в коде; значение повторяет Excel.
  cdr_contact_floor: 0.80
  plr_perfect: 0.20
  plr_maxim: 0.25
  plr_problema: 0.35
  sc_perfect: 0.20
  sc_bine: 0.15
  sc_minim: 0.10
  pfr_perfect: 0.10
  pfr_bine: 0.15
  pfr_maxim: 0.20
  acr_perfect: 0.20
  acr_maxim: 0.30
  irr_acceptabil: 0.20
  irr_atentie: 0.30

# Оферта «висит», если с последнего контакта прошло строго больше N дней (01_Input_Leads!AC).
active_offer_stale_days: 14

# Уровень по SPI, первый подходящий сверху (03_KPI_Agenti!AD).
levels:
  - { name: Elite, min_spi: 90 }
  - { name: Gold, min_spi: 80 }
  - { name: Silver, min_spi: 70 }
  - { name: Bronze, min_spi: 60 }
  - { name: Coaching, min_spi: 0 }

# Очки по ступеням, проверка сверху вниз, первая выполненная (docs/kpi-definitions.md, «Баллы»).
# higher: KPI >= порога; lower: KPI <= порога. KPI = null → otherwise (нижняя ступень, ADR-002).
scores:
  scr: { direction: higher, steps: [[scr_elite, 30], [scr_bine, 24], [scr_minim, 18]], otherwise: 10 }
  cdr: { direction: higher, steps: [[cdr_perfect, 20], [cdr_minim, 16], [cdr_contact_floor, 10]], otherwise: 5 }
  plr: { direction: lower, steps: [[plr_perfect, 20], [plr_maxim, 16], [plr_problema, 10]], otherwise: 5 }
  sc: { direction: higher, steps: [[sc_perfect, 15], [sc_bine, 12], [sc_minim, 8]], otherwise: 4 }
  pfr: { direction: lower, steps: [[pfr_perfect, 10], [pfr_bine, 8], [pfr_maxim, 5]], otherwise: 2 }
  acr: { direction: lower, steps: [[acr_perfect, 5], [acr_maxim, 3]], otherwise: 1 }

irr_penalty: { direction: lower, steps: [[irr_acceptabil, 0], [irr_atentie, -5]], otherwise: -10 }

# Главная рекомендация: первое сработавшее условие сверху вниз, сравнение строгое.
# KPI = null условие не срабатывает; LEADS = 0 → рекомендации нет. Тексты RO/RU в templates/.
recommendations:
  - { key: irr_status_check,       kpi: irr, above: irr_atentie }
  - { key: contact_discipline,     kpi: cdr, below: cdr_minim }
  - { key: price_value,            kpi: plr, above: plr_maxim }
  - { key: closing,                kpi: scr, below: scr_minim }
  - { key: active_offers_followup, kpi: acr, above: acr_perfect }
recommendation_otherwise: stable_performance

# Цели для m5, показываются рядом с фактом. Выполнена: higher → KPI >= value, lower → KPI <= value.
# Значения = первые ступени thresholds плюс L2O и O2C из брифа; provisional, как и пороги.
targets:
  scr: { direction: higher, value: 0.10 }
  l2o: { direction: higher, value: 0.50 }
  o2c: { direction: higher, value: 0.20 }
  cdr: { direction: higher, value: 0.90 }
  plr: { direction: lower, value: 0.25 }
  sc: { direction: higher, value: 0.20 }
  pfr: { direction: lower, value: 0.10 }
  acr: { direction: lower, value: 0.20 }
  irr: { direction: lower, value: 0.20 }
