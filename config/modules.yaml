# Реестр модулей отчётов. label: название в /settings, до 28 символов, полный заголовок в docs/report-menu.md.
# enabled — дефолт при первом запуске; дальше — таблица module_settings в Postgres через /settings.
# Модуль нельзя включить, пока не подключены все его sources: проверяется при загрузке конфига.
# requires_kpi_status: calibrated — модуль нельзя включить, пока kpi.yaml в status: provisional.

sources:
  A: { title: "mefi leads:read",                           connected: true }
  B: { title: "mefi сессия: Oferte, Contracte, Facturi",   connected: false }
  C: { title: "mefi calls:read",                           connected: false }
  D: { title: "Ads API: Meta, Google, TikTok",             connected: false }
  E: { title: "GA4",                                       connected: false }
  F: { title: "Excel 2024–2025",                           connected: false }
  G: { title: "себестоимость",                             connected: false }
  H: { title: "LLM из заметок",                            connected: false }
  I: { title: "mefi clients:read",                         connected: true }

daily:            # окно 19:00 вчера → 19:00 сегодня; время отправки в таблице schedules
  # I только для строки Contract Cantitate: без клиентов отчёт уходит с «—» в ней (ADR-006).
  d1: { name: seller_format_report, label: "Raport format consilieri",   sources: [A, I], enabled: true }
  # last_contact_at у нового лида отстаёт от created_at до минуты (замер 25.09.2026: 982 точно, 14 до 60 с).
  d2: { name: untouched_leads, label: "Lead-uri neatinse azi",        sources: [A], enabled: true,  params: { threshold_hours: 4, lookback_days: 3, touch_tolerance_seconds: 60 } }
  # missing_followup_date: блок «Fără Data revenire»; false, если поле необязательно (П5).
  d3: { name: overdue_revenire, label: "Revenire depășită",       sources: [A], enabled: true,  params: { missing_followup_date: true, missing_followup_min_age_hours: 24 } }
  # Срок «висящей» оферты: kpi.yaml active_offer_stale_days, тот же, что в ACR.
  d4: { name: stale_offers, label: "Oferte fără mișcare 14 zile",           sources: [A], enabled: true }
  # 646 лидов с Site за восемь месяцев, меньше трёх в день: порог 3 почти не срабатывал бы.
  d5: { name: anomalies, label: "Anomalii ale zilei",              sources: [A], enabled: true,  params: { site_zero_min_average: 2, site_average_days: 7, irelevant_spike_min: 5 } }
  d6: { name: same_weekday_compare, label: "Comparație cu aceeași zi",   sources: [A], enabled: true }
  # Порог 2,0 п.п. (около 7 договоров на объёме сентября 2026): 1,0 мигал «=»/«↓» 9 раз за месяц
  # (docs/shapes/2026-09-30-d7.md, «Замер»).
  d7: { name: rolling_contract_rate, label: "Rată contracte 30 de zile",  sources: [A], enabled: true,  params: { window_days: 30, trend_threshold_pp: 2.0 } }
  d8: { name: instant_alerts, label: "Alertă imediată",         sources: [A], enabled: false, params: { site_zero_by: "15:00" } }

weekly:           # пн–вс, отправка в понедельник; время в таблице schedules
  w1:  { name: leads_day_showroom_source, label: "Lead-uri pe zi și showroom", sources: [A], enabled: true }
  w2:  { name: showroom_visits, label: "Vizite în showroom",           sources: [A], enabled: true }
  w3:  { name: weekly_funnel, label: "Pâlnia săptămânii",             sources: [A], enabled: true }
  w4:  { name: loss_reasons, label: "Motive de pierdere",              sources: [A], enabled: true }
  w5:  { name: speed_to_lead, label: "Viteza primului contact",             sources: [A], enabled: false }
  # Пороги по живому снапшоту 28.09.2026 (docs/shapes/2026-09-28-sources.md): 10 лидов в неделю
  # оставляют Showroom, Site, WhatsApp, иногда Telefon и Mail; кампаний с 5 лидами в неделю обычно одна.
  w6:  { name: irr_by_campaign, label: "Campanii cu irelevanți",           sources: [A], enabled: true, params: { min_source_leads: 10, min_campaign_leads: 5, top_rows: 3, campaign_label_max_length: 40 } }
  w7:  { name: missed_calls_no_lead, label: "Apeluri pierdute fără lead",      sources: [C], enabled: false }
  w8:  { name: week_over_week, label: "Față de săptămâna trecută",            sources: [A], enabled: true }
  # Касания по разнице соседних success-снапшотов (docs/shapes/2026-09-29-touches.md); выше w12,
  # чтобы блок шёл до вложения Excel.
  w14: { name: manager_touches, label: "Atingeri consultanți",           sources: [A], enabled: true }
  w9:  { name: cost_per_lead_by_channel, label: "Cost per lead pe canal",  sources: [A, D], enabled: false }
  w10: { name: spend_without_leads, label: "Campanii fără lead-uri",       sources: [D], enabled: false }
  w11: { name: sessions_to_leads, label: "Trafic site → lead-uri",         sources: [A, E], enabled: false }
  w12: { name: excel_attachment, label: "Fișier Excel",          sources: [A], enabled: true }

monthly:          # календарный месяц, отправка 1-го числа; время в таблице schedules
  m1:  { name: month_summary_image, label: "Rezumatul lunii",   sources: [B],    enabled: false }
  m2:  { name: funnel_by_showroom_image, label: "Pâlnia lunii pe showroom", sources: [A], enabled: true }
  m3:  { name: trend_6m_image, label: "Trend 6 luni",        sources: [A],    enabled: true }
  # Ступени уровня SCR сверху вниз, имена порогов из kpi.yaml thresholds. Подписи из docs/report-menu.md m4,
  # не совпадают с уровнями SPI (проверяется при загрузке).
  m4:
    name: scr_with_targets
    label: "Conversie SCR cu ținte"
    sources: [A]
    enabled: true
    params:
      levels:
        - { threshold: scr_elite, label: "Elită" }
        - { threshold: scr_bine,  label: "Bine" }
        - { threshold: scr_minim, label: "Minim" }
      below_label: "Sub minim"
  # Таблица 9 KPI по консультантам (docs/kpi-definitions.md) с целями, без SPI, баллов и уровней.
  m5:  { name: manager_cockpit, label: "Manager Cockpit",       sources: [A],    enabled: true }
  # Баллы и SPI предварительные (ADR-002): включить можно только при kpi.yaml status: calibrated.
  m6:  { name: spi_ranking, label: "Clasament SPI",           sources: [A],    enabled: false, requires_kpi_status: calibrated }
  # 10 лидов в месяц сворачивают в «Alte surse» Colaborare, Recomandare, Meta ADS, Client Fidel и прочие
  # единичные источники (снапшот 28.09.2026).
  m7:  { name: scr_by_source_campaign, label: "Conversie pe sursă", sources: [A],   enabled: true, params: { min_source_leads: 10, min_campaign_leads: 5, campaign_label_max_length: 40 } }
  m8:  { name: loss_reasons_trend, label: "Motive de pierdere, evoluție",    sources: [A],    enabled: true }
  # Корзины «клиент за ≤N дней от создания лида», по возрастанию; ≤N видна, когда когорте ≥ N суток.
  # fast_cycle_days: порог «быстрого» договора в строке цикла (docs/kpi-definitions.md, m9).
  m9:  { name: cohort_conversion, label: "Conversie de cohortă",     sources: [A],    enabled: true, params: { age_buckets_days: [7, 30, 90], fast_cycle_days: 7, baseline_cohort_days: 30 } }
  m10: { name: contracts_avg_value, label: "Contracte și valoare medie",   sources: [B],    enabled: false }
  m11: { name: repeat_clients, label: "Clienți care revin",        sources: [A],    enabled: true }
  m12: { name: cpo_cac_by_channel, label: "CPO și CAC pe canal",    sources: [A, D], enabled: false }
  m13: { name: ad_return, label: "Randamentul reclamei",             sources: [B, D], enabled: false }
  m14: { name: cash_margin, label: "Încasări, avansuri, marjă",           sources: [B, G], enabled: false }
  m15: { name: reoffers_cancellations, label: "Reoferte, contracte anulate", sources: [B],   enabled: false }
  m16: { name: top_products, label: "Top produse",          sources: [B, G], enabled: false }
  m17: { name: competitors_from_notes, label: "Concurenți menționați", sources: [H],   enabled: false }
  m18: { name: models_in_demand, label: "Modele cerute",      sources: [H],    enabled: false }
  m19: { name: excel_monthly_attachment, label: "Fișier Excel lunar",  sources: [A],    enabled: true }

yearly:           # 5 января 09:00
  y1: { name: seasonality, label: "Sezonalitate",            sources: [A],    enabled: false }
  y2: { name: year_over_year, label: "An față de an",         sources: [A, F], enabled: false }
  y3: { name: showroom_manager_of_year, label: "Cei mai buni ai anului", sources: [A],  enabled: false }
  y4: { name: loss_reasons_by_quarter, label: "Pierderi pe trimestre", sources: [A],   enabled: false }
  y5: { name: sources_growth, label: "Surse în creștere, scădere",         sources: [A],    enabled: false }
  y6: { name: ad_budget_year, label: "Buget reclamă pe an",         sources: [D],    enabled: false }
  y7: { name: contracts_cash_margin_year, label: "Contracte, încasări, marjă", sources: [B, G], enabled: false }
  y8: { name: competitors_models_year, label: "Concurenți și modele pe an", sources: [H],   enabled: false }

# Варианты времени отправки в /settings. Кавычки обязательны: YAML читает 19:30 без кавычек как число.
send_times:
  daily:   ["19:30", "20:00", "20:30"]
  weekly:  ["08:00", "09:00", "10:00"]
  monthly: ["08:00", "09:00", "10:00"]

# Догон отчёта при старте процесса: сколько дней после штатного дня отправки он ещё уходит
# с пометкой «Raport trimis cu întârziere». 0 = только в тот же день. Yearly не догоняется.
catch_up_days: { daily: 0, weekly: 2, monthly: 4 }

chat:             # режим вопросов; включается целиком, переключатель в /settings
  enabled: false
  trigger: [mention, reply]
  daily_question_limit: 30   # на чат за календарный день по Бухаресту
  context_minutes: 10        # вопрос того же пользователя моложе этого: контекст уточнения
  max_tool_calls: 3          # на вопрос; следующий раунд модели только текстом
  max_answer_tokens: 600     # ответ в несколько предложений, без таблиц
  specific_date_history_years: 1  # конкретные день и месяц не раньше первого снапшота минус N лет
  # Реестр инструментов: ключ — имя инструмента в коде (digest/chat/tools.py), значение —
  # описание для модели на румынском. Убрать ключ = выключить инструмент.
  tools:
    funnel: >-
      Pâlnia de vânzări pentru o perioadă: lead-uri, lead-uri utile, irelevante, vizite în showroom,
      oferte, clienți, nu a răspuns, buget, produs nepotrivit, contracte semnate și KPI (SCR, L2O,
      O2C, CDR, PLR, SC, PFR, ACR, IRR). Lead-urile sunt cele create în perioadă, cu statusul din
      snapshot. day_count și days_with_data dau numărul de zile ale perioadei și câte au date.
      SCR este conversia lead-urilor create în perioadă; rata contractelor pe ultimele 30 de zile este instrumentul separat rolling_contract_rate.
      Opțional pentru un singur showroom.
    manager_kpi: >-
      KPI-urile unui consultant pentru o perioadă: numărătorile pâlniei, cei 9 KPI și dacă ținta
      fiecărui KPI este atinsă. targets_met din targets_total dă câte ținte sunt atinse; vs_target
      dă diferența fiecărui KPI față de țintă, în puncte procentuale, cu semn; la KPI cu plafon
      (PLR, PFR, ACR, IRR), minus înseamnă în limită; citești vs_target împreună cu meets_target.
    compare_periods: >-
      Compară o singură metrică între două perioade (de ex. lead-uri săptămâna aceasta față de
      săptămâna trecută). period_a este perioada evaluată (de obicei cea mai recentă), period_b
      este baza comparației. Câmpul change dă schimbarea gata formulată, cu valoarea period_a
      întâi („138 față de 135: +3 (+2,2%)”; la KPI valorile în procente și diferența în puncte
      procentuale, „14,2% față de 16,0%: −1,8 pp”); o citezi exact. difference este
      diferența fără semn, direction este creștere, scădere sau fără schimbare. day_count și
      days_with_data dau numărul de zile ale fiecărei perioade și câte au date.
      SCR este conversia lead-urilor create în perioadă; rata contractelor pe ultimele 30 de zile este instrumentul separat rolling_contract_rate.
      Opțional pentru un singur showroom.
    loss_reasons: >-
      Lead-uri pierdute într-o perioadă, pe motive (Nu a răspuns, Buget, Produs nepotrivit etc.)
      și pe showroom. La fiecare motiv, share este ponderea lui în total (în showroom, din totalul
      showroom-ului); showroom_count dă câte showroom-uri au pierderi. Opțional pentru un singur
      showroom.
    overdue_followups: >-
      Lead-uri cu Data revenire depășită, pe consultant, cu numărul maxim de zile de întârziere;
      manager_count dă câți consultanți au întârzieri. Câmpul missing_followup_date dă lead-urile
      fără Data revenire aflate într-unul din statusurile din lista statuses (numele se scriu
      întregi, exact ca în listă); unavailable înseamnă că Data revenire nu a putut fi citită din
      CRM și nu dai un număr pentru ea. Opțional pentru un singur consultant.
    untouched_leads: >-
      Lead-uri noi neatinse de consultant (fără schimbare de status, contact sau ofertă) după
      pragul de ore, pe consultant, din ultimele zile. oldest_age_days este vârsta celui mai vechi
      în zile întregi; manager_count dă câți consultanți au lead-uri neatinse.
    source_breakdown: >-
      Lead-urile unei perioade pe sursă (source_name) sau pe campania din UTM_Campanie
      (utm_campanie): pentru fiecare rând lead-uri, utile, oferte, clienți, IRR și SCR. total
      este totalul perioadei, egal cu funnel; row_count dă numărul de rânduri; without_key sunt
      lead-urile fără sursă sau fără campanie; la campanii, leads_with_key este numărul
      lead-urilor cu campanie, iar key_share ponderea lor; other, dacă nu este null, adună
      sursele sau campaniile mici într-un rând. Numele surselor și campaniilor se scriu exact ca
      în rezultat. Opțional pentru un singur showroom.
    repeat_clients: >-
      Clienții care revin într-o lună: din clienții lunii (clients), câți sunt clienți anteriori
      (repeat, share), pe motiv (by_reason: telefon sau e-mail al unui client anterior din CRM,
      ori sursa Client Fidel) și pe showroom (by_showroom, toate showroom-urile, și cele cu 0;
      showroom_count dă câte showroom-uri au clienți). Clienții de dinainte de CRM (înainte de 2026) fără sursa Client Fidel nu se văd,
      deci procentul este subestimat. won_without_converted_at sunt lead-uri Clienți fără dată de
      conversie, neincluse. Doar pe lună.
    manager_touches: >-
      Atingerile consultanților într-o zi sau o săptămână: o atingere este trecerea unui lead în
      Revenire N înregistrată în CRM, nu apelul în sine. touch_count este totalul, by_level pe
      status (numele întregi, exact ca în rezultat), by_manager pe consultant; manager_count și
      managers_without_touches dau câți consultanți au, respectiv nu au atingeri. covered_from,
      covered_until și days_without_snapshot spun pentru ce zile există date; dacă lipsesc zile,
      o spui. Doar zile și săptămâni, nu luni. Opțional pentru un singur consultant.
    rolling_contract_rate: >-
      Rata contractelor pe ultimele window_days zile (30) la data ultimului snapshot: contracte
      după data semnării (contracts) împărțite la lead-urile utile create în aceleași zile
      (useful), față de cele window_days zile anterioare (previous_*). period și previous_period
      dau zilele. difference este diferența în puncte procentuale, cu semn; direction este
      creștere, scădere sau stabilă, când diferența este sub trend_threshold. Nu este SCR-ul
      lunii; pentru SCR pe lună folosești funnel. Fără parametri.
  # Описания параметров по имени, для каждого инструмента с таким параметром.
  parameters:
    period_a: Perioada evaluată, de obicei cea mai recentă (de ex. august în „august față de iulie”).
    by: "source_name: pe sursa lead-ului din CRM; utm_campanie: pe campania din UTM_Campanie."
    period_b: Baza comparației, de obicei perioada mai veche (de ex. iulie în „august față de iulie”).
