# Эталонный набор чата, ворота M6 (docs/success-criteria.md, docs/shapes/2026-09-29-acceptance.md).
# Числа не хардкодятся: раннер считает их тем же инструментом на снапшоте прогона (numbers = пути
# в content результата). arguments: точный набор или список допустимых наборов. Даты выбраны по
# снапшотам 27.09 и 28.09.2026; когда их удалят, eval покажет «вопрос устарел».

# funnel
- id: funnel-last-week
  tags: [named_period]
  question: "Câte lead-uri am avut săptămâna trecută?"
  expect: answer
  calls:
    - tool: funnel
      arguments: {period: saptamana_trecuta, showroom: toate}
      numbers: [counts.leads]

- id: funnel-last-week-bucuresti
  tags: [named_period, showroom]
  question: "Câte lead-uri a avut showroomul din București săptămâna trecută?"
  expect: answer
  calls:
    - tool: funnel
      arguments: {period: saptamana_trecuta, showroom: "București"}
      numbers: [counts.leads]

- id: followup-cluj
  tags: [followup, showroom]
  after: funnel-last-week-bucuresti
  question: "Dar Cluj?"
  expect: answer
  calls:
    - tool: funnel
      arguments: {period: saptamana_trecuta, showroom: "Cluj"}
      numbers: [counts.leads]

- id: followup-brasov
  tags: [followup, showroom]
  after: followup-cluj
  question: "Și Brașov?"
  expect: answer
  calls:
    - tool: funnel
      arguments: {period: saptamana_trecuta, showroom: "Brașov"}
      numbers: [counts.leads]

- id: funnel-this-month-offers
  tags: [named_period]
  question: "Câte oferte am făcut luna aceasta?"
  expect: answer
  calls:
    - tool: funnel
      arguments: {period: luna_curenta, showroom: toate}
      numbers: [counts.offers]

- id: funnel-august-scr
  tags: [specific_month]
  question: "Care a fost SCR-ul în august?"
  expect: answer
  calls:
    - tool: funnel
      arguments:
        - {period: luna_trecuta, showroom: toate}
        - {period: {year: 2026, month: 8}, showroom: toate}
      numbers: [kpis.scr]

- id: funnel-day-28-09
  tags: [specific_day]
  question: "Câte lead-uri au intrat pe 28 septembrie 2026?"
  expect: answer
  calls:
    - tool: funnel
      arguments:
        - {period: {day: "2026-09-28"}, showroom: toate}
        - {period: ieri, showroom: toate}
      numbers: [counts.leads]

- id: funnel-30-days-contracts
  tags: [named_period]
  question: "Câte contracte am semnat în ultimele 30 de zile?"
  expect: answer
  calls:
    - tool: funnel
      arguments: {period: ultimele_30_zile, showroom: toate}
      numbers: [contracts]

