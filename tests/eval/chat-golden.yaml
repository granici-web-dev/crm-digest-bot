# compare_periods
- id: compare-leads-weeks
  tags: [compare, named_period]
  question: "Cum se compară numărul de lead-uri din săptămâna trecută cu cel din săptămâna aceasta?"
  expect: answer
  calls:
    - tool: compare_periods
      arguments:
        - {metric: leads, period_a: saptamana_trecuta, period_b: saptamana_curenta, showroom: toate}
        - {metric: leads, period_a: saptamana_curenta, period_b: saptamana_trecuta, showroom: toate}
      numbers: [period_a.value, period_b.value]

- id: compare-offers-months
  tags: [compare, specific_month]
  question: "Am făcut mai multe oferte în septembrie decât în august?"
  expect: answer
  calls:
    - tool: compare_periods
      arguments:
        - {metric: offers, period_a: luna_curenta, period_b: luna_trecuta, showroom: toate}
        - {metric: offers, period_a: luna_trecuta, period_b: luna_curenta, showroom: toate}
        - {metric: offers, period_a: luna_curenta, period_b: {year: 2026, month: 8}, showroom: toate}
        - {metric: offers, period_a: {year: 2026, month: 8}, period_b: luna_curenta, showroom: toate}
        - {metric: offers, period_a: {year: 2026, month: 9}, period_b: {year: 2026, month: 8}, showroom: toate}
        - {metric: offers, period_a: {year: 2026, month: 8}, period_b: {year: 2026, month: 9}, showroom: toate}
      numbers: [period_a.value, period_b.value]

- id: compare-scr-bucuresti
  tags: [compare, showroom, named_period]
  question: "Compară SCR-ul din București între săptămâna trecută și săptămâna aceasta."
  expect: answer
  calls:
    - tool: compare_periods
      arguments:
        - {metric: scr, period_a: saptamana_trecuta, period_b: saptamana_curenta, showroom: "București"}
        - {metric: scr, period_a: saptamana_curenta, period_b: saptamana_trecuta, showroom: "București"}
      numbers: [period_a.value, period_b.value]

