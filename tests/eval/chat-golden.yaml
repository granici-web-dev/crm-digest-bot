# I4: новые инструменты (docs/shapes/2026-09-29-chat-new-tools.md). В ворота M6 не идут.
# Касания только на днях с парой снапшотов (27.09 → 28.09 и дальше).
- id: src-last-month
  tags: [i4, source, named_period]
  question: "Câte lead-uri a adus fiecare sursă luna trecută?"
  expect: answer
  calls:
    - tool: source_breakdown
      arguments: {period: luna_trecuta, by: source_name, showroom: toate}
      # Вопрос не спрашивает число строк: ждём итог и самый крупный источник (rows[0], строки по
      # убыванию лидов). Набор I4 ещё не в зачёте, поэтому ожидание правится без пересмотра ворот.
      numbers: [total.leads, "rows[0].leads"]

- id: src-site-scr-august
  tags: [i4, source, specific_month]
  question: "Ce SCR au avut lead-urile din Site în august?"
  expect: answer
  calls:
    - tool: source_breakdown
      arguments: {period: {year: 2026, month: 8}, by: source_name, showroom: toate}
      numbers: ["rows[key=Site].scr"]

- id: campaigns-this-month
  tags: [i4, source, named_period]
  question: "Câte lead-uri au venit din campanii luna aceasta?"
  expect: answer
  calls:
    - tool: source_breakdown
      arguments: {period: luna_curenta, by: utm_campanie, showroom: toate}
      numbers: [leads_with_key]

- id: followup-src-cluj
  tags: [i4, followup, source, showroom]
  after: src-last-month
  question: "Dar în Cluj?"
  expect: answer
  calls:
    - tool: source_breakdown
      arguments: {period: luna_trecuta, by: source_name, showroom: "Cluj"}
      numbers: [total.leads]

